services:
  - type: web
    name: crop-season-ai-backend
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: ALLOWED_ORIGINS
        value: https://crop-season-ai.vercel.app,http://localhost:3000,http://127.0.0.1:5500
      - key: FRONTEND_URL
        value: https://crop-season-ai.vercel.app
      - key: PYTHON_VERSION
        value: 3.11.0